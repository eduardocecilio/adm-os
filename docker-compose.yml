version: '3.8'

services:
  backend:
    build: ./backend
    container_name: adm-os-backend
    # ports:
    #   - "8001:8000" (Removed to secure backend)
    volumes:
      - adm_os_data:/data
    # env_file:
    #   - ./backend/.env
    environment:
      - API_TOKEN=${API_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - FRONTEND_URL=${FRONTEND_URL}
      - ENV=${ENV}
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: adm-os-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: adm-os-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: always

volumes:
  adm_os_data:
  postgres_data:
