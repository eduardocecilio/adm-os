services:
  backend:
    image: ghcr.io/eduardocecilio/adm-os-backend:latest
    pull_policy: always
    container_name: adm-os-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      RESET_SECRET_KEY: ${RESET_SECRET_KEY}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      ENV: production
      TZ: America/Sao_Paulo
    depends_on:
      adm_os_db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  adm_os_db:
    image: postgres:15-alpine
    container_name: adm-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - db_admin_net

  frontend:
    image: ghcr.io/eduardocecilio/adm-os-frontend:latest
    pull_policy: always
    container_name: adm-os-frontend
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      internal: {}
      proxy_net:
        aliases:
          - adm-os

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  proxy_net:
    external: true
    name: proxy_net
  db_admin_net:
    external: true
    name: db_admin_net
