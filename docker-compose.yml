services:
  backend:
    image: ghcr.io/eduardocecilio/adm-os-backend:latest
    pull_policy: always
    container_name: adm-os-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      RESET_SECRET_KEY: ${RESET_SECRET_KEY}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      ENV: production
    depends_on:
      adm_os_db:
        condition: service_healthy
    networks:
      - internal

  adm_os_db:
    image: postgres:15-alpine
    container_name: adm-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  frontend:
    image: ghcr.io/eduardocecilio/adm-os-frontend:latest
    pull_policy: always
    container_name: adm-os-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - infra_net:
          aliases:
            - adm-os

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  infra_net:
    external: true
    name: infra_net
