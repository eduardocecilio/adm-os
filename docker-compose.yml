services:
  backend:
    build: ./backend
    container_name: adm-os-backend
    restart: unless-stopped
    volumes:
      - adm_os_data:/data
    environment:
      API_TOKEN: ${API_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      ENV: ${ENV}
    depends_on:
      adm_os_db:
        condition: service_healthy

  adm_os_db:
    image: postgres:15-alpine
    container_name: adm-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - infra_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: adm-os-frontend
    restart: unless-stopped
    ports:
      - "8082:80" #o idal e ser 172.17.0.1:8082 mas como estamos rodando localmente, usamos 0.0.0.0, mas isso e uma ma pratica, pois estamos exposto para a rede global e pode ser um risco de segurança
    depends_on:
      - backend

volumes:
  adm_os_data:
  postgres_data:


networks:
  infra_net:
    external: true
    name: infra_net
