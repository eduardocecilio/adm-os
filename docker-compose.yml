services:
  backend:
    build: ./backend
    image: ghcr.io/eduardocecilio/adm-os-backend:latest
    pull_policy: always
    container_name: adm-os-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      RESET_SECRET_KEY: ${RESET_SECRET_KEY}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN}
      EMAIL_FROM: ${EMAIL_FROM:-Adm OS <nao-responda@ceciliolab.com>}
      FRONTEND_URL: ${FRONTEND_URL:-https://ceciliolab.com}
      ENV: ${ENV:-production}
    depends_on:
      adm_os_db:
        condition: service_healthy

  adm_os_db:
    image: postgres:15-alpine
    container_name: adm-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - infra_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: ghcr.io/eduardocecilio/adm-os-frontend:latest
    pull_policy: always
    container_name: adm-os-frontend
    restart: unless-stopped
    ports:
      - "${BIND_IP:-172.17.0.1}:8082:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  infra_net:
    external: true
    name: infra_net
