version: '3.8'

services:
  backend:
    build: ./backend
    container_name: adm-os-backend
    ports:
      - "8001:8000"
    volumes:
      - adm_os_data:/data
    environment:
      - API_TOKEN=${API_TOKEN}
      - DATABASE_URL=sqlite:////data/adm_os.db
    restart: always

  frontend:
    build: ./frontend
    container_name: adm-os-frontend
    ports:
      - "8082:80" # Porta 8082 liberada para acesso externo
    depends_on:
      - backend
    restart: always

volumes:
  adm_os_data: