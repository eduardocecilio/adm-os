name: GHCR cleanup

on:
  schedule:
    - cron: "17 4 * * 0"  # Todo domingo às 04:17 UTC
  workflow_dispatch:      # Permite rodar manualmente pelo painel

permissions:
  packages: write
  contents: read

jobs:
  cleanup_packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [adm-os-backend, adm-os-frontend]

    steps:
      - name: Lixeira de Untagged (Manter as últimas 5 sobras do latest)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: "true"

      - name: Limpeza Geral (Manter apenas as últimas 30 versões totais)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 30
